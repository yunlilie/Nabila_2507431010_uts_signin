<!DOCTYPE HTML> 
<html lang= "id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nana Book for Kids</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Irish+Grover&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" href="android-chrome-192x192.png" type="image/x-icon">
    
</head>
<body> 
    <main class="split-layout">
        <section class="illus-panel" aria-label="latar belakang nanab nabila">
        </section>
        <section class="form-panel">
            <div class="login-wrapper">
                <div class="brand-header">
                    <img src="20237.gif" alt="Nana Book" style="width: 50%;" class="brand-gif">
                    <h1 class="brand-title-font">Nana Book for Kids</h1>
                </div>
                <button type="button" class="sso-button" aria-label="Sign in with Google">
                    <img src="google.svg" width="24"> Sign in with Google
                </button>
                <div class="divider" aria-hidden="true">
                    <span class="divider-text">or</span>
                </div>
            <form action="#" method="POST">
                    <div class="input-group">
                        <label for="user-identifier">Email atau Username</label>
                        <input type="text" id="user-identifier" name="user-identifier" required>
                    </div>
                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <div class="input-group">
                        <label for="remember-me">
                            <input type="checkbox" id="remember-me" name="remember-me">
                            remember me please
                        </label>
                    </div>
                    <button type="submit" class="submit-btn">Login</button>
                </form>
            </div>

        </section>
           
    </main>
</body>
</html>
